name: Validate preset

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate preset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # renovate 44 declares engines.node ^24.11.0.
          node-version: 24
      # The major is pinned: an unpinned `--package renovate` can resolve a stale
      # cached major and validate against rules that no longer apply (#446).
      - name: renovate-config-validator
        run: npx --yes --package renovate@44 -- renovate-config-validator --strict default.json
      # The preset's self-test (#447). Fails until test/ exists, which is intended:
      # it lands in the same PR as default.json.
      - name: Preset self-test
        run: node --test
